services:
  redis:
    image: redis:alpine
    container_name: imessage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8
    container_name: imessage-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend1:
    build:
      context: .
    container_name: imessage-backend1
    restart: unless-stopped
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/imessage}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend2:
    build:
      context: .
    container_name: imessage-backend2
    restart: unless-stopped
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/imessage}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5001:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
    container_name: imessage-frontend
    restart: unless-stopped
    depends_on:
      backend1:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mongo_data:
